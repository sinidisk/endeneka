<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neka is online</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="menu-bar">
        <div class="menu-item apple">Ø</div>
        <div class="menu-item">File</div>
        <div class="menu-item">Edit</div>
        <div class="menu-item">View</div>
        <div class="menu-item">Special</div>
        <div class="menu-item">Help</div>
        <div class="menu-spacer"></div>
        <div class="menu-time" id="menuTime">12:00 PM</div>
    </div>

    <div class="desktop" id="desktop">
        <!-- Music Window -->
        <div class="window" id="musicWindow" style="width: 400px; height: 550px; left: 100px; top: 80px;">
            <div class="window-title-bar" data-window="musicWindow">
                <div class="window-buttons">
                    <div class="window-button close" onclick="closeWindow('musicWindow')">×</div>
                    <div class="window-button maximize" onclick="toggleMaximize('musicWindow')">□</div>
                </div>
                <div class="window-title">Music Player</div>
            </div>
            <div class="window-content">
                <div class="album-art" id="albumArt">🎵</div>
                <div class="player-info" id="playerInfo">
                    <div style="font-weight: bold; margin-bottom: 4px;">No track loaded</div>
                    <div style="font-size: 10px; color: #606060;">Add your MP3 files to play music</div>
                </div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                    <div class="progress-time" id="progressTime">0:00 / 0:00</div>
                </div>
                <div class="volume-control">
                    <span style="font-size: 11px;">🔊</span>
                    <div class="volume-slider" id="volumeSlider">
                        <div class="volume-fill" id="volumeFill"></div>
                    </div>
                </div>
                <div class="player-controls">
                    <button class="mac-button" onclick="previousTrack()">⏮️ Prev</button>
                    <button class="mac-button" onclick="togglePlay()" id="playBtn">▶️ Play</button>
                    <button class="mac-button" onclick="stopTrack()">⏹️ Stop</button>
                    <button class="mac-button" onclick="nextTrack()">⏭️ Next</button>
                    <button class="mac-button" onclick="toggleShuffle()" id="shuffleBtn">🔀</button>
                    <button class="mac-button" onclick="toggleRepeat()" id="repeatBtn">🔁</button>
                </div>
                <div style="margin: 8px 0; font-size: 11px; font-weight: bold;">Playlist:</div>
                <div class="playlist" id="playlist"></div>
            </div>
            <div class="window-resize-handle" data-window="musicWindow"></div>
        </div>

        <!-- Gallery Window -->
        <div class="window" id="galleryWindow" style="width: 600px; height: 500px; left: 150px; top: 100px;">
            <div class="window-title-bar" data-window="galleryWindow">
                <div class="window-buttons">
                    <div class="window-button close" onclick="closeWindow('galleryWindow')">×</div>
                    <div class="window-button maximize" onclick="toggleMaximize('galleryWindow')">□</div>
                </div>
                <div class="window-title">Gallery</div>
            </div>
            <div class="window-content">
                <div class="gallery-nav">
                    <button class="mac-button" onclick="switchFolder('photos')">📷 Photos</button>
                    <button class="mac-button" onclick="switchFolder('drawings')">🎨 Drawings</button>
                </div>
                <div class="gallery-grid" id="galleryGrid"></div>
            </div>
            <div class="window-resize-handle" data-window="galleryWindow"></div>
        </div>

        <!-- Image Viewer Window -->
        <div class="window" id="imageWindow" style="width: 500px; height: 550px; left: 200px; top: 120px;">
            <div class="window-title-bar" data-window="imageWindow">
                <div class="window-buttons">
                    <div class="window-button close" onclick="closeWindow('imageWindow')">×</div>
                    <div class="window-button maximize" onclick="toggleMaximize('imageWindow')">□</div>
                </div>
                <div class="window-title" id="imageTitle">Image Viewer</div>
            </div>
            <div class="window-content">
                <div class="image-viewer" id="imageViewer"></div>
            </div>
            <div class="window-resize-handle" data-window="imageWindow"></div>
        </div>

        <!-- Videos Window -->
        <div class="window" id="videosWindow" style="width: 640px; height: 500px; left: 180px; top: 100px;">
            <div class="window-title-bar" data-window="videosWindow">
                <div class="window-buttons">
                    <div class="window-button close" onclick="closeWindow('videosWindow')">×</div>
                    <div class="window-button maximize" onclick="toggleMaximize('videosWindow')">□</div>
                </div>
                <div class="window-title">Videos</div>
            </div>
            <div class="window-content">
                <video id="videoPlayer" class="video-player" controls style="width: 100%; max-height: 360px;">
                    <source src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div style="margin: 8px 0; font-size: 11px; font-weight: bold;">Video Library:</div>
                <div class="video-list" id="videoList"></div>
            </div>
            <div class="window-resize-handle" data-window="videosWindow"></div>
        </div>

        <!-- Notes Window -->
        <div class="window" id="notesWindow" style="width: 700px; height: 500px; left: 120px; top: 90px;">
            <div class="window-title-bar" data-window="notesWindow">
                <div class="window-buttons">
                    <div class="window-button close" onclick="closeWindow('notesWindow')">×</div>
                    <div class="window-button maximize" onclick="toggleMaximize('notesWindow')">□</div>
                </div>
                <div class="window-title">Notes</div>
            </div>
            <div class="window-content" style="padding: 0;">
                <div class="notes-layout">
                    <div class="notes-sidebar" id="notesSidebar">
                        <div style="padding: 8px; text-align: center; color: #606060; font-size: 10px;">
                            Loading notes...
                        </div>
                    </div>
                    <div class="notes-content" id="notesContent">
                        Select a note to view its content...
                    </div>
                </div>
            </div>
            <div class="window-resize-handle" data-window="notesWindow"></div>
        </div>
    </div>

    <div class="dock">
        <div class="dock-icon" onclick="openWindow('musicWindow')" title="Music Player">🎵</div>
        <div class="dock-icon" onclick="openWindow('galleryWindow')" title="Gallery">🖼️</div>
        <div class="dock-icon" onclick="openWindow('videosWindow')" title="Videos">🎬</div>
        <div class="dock-icon" onclick="openWindow('notesWindow')" title="Notes">📝</div>
    </div>

    <script>
        // Clock
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const displayHours = hours % 12 || 12;
            document.getElementById('menuTime').textContent = `${displayHours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Advanced Window Management
        let zIndexCounter = 100;
        let draggedWindow = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let resizingWindow = null;
        let resizeStartX = 0;
        let resizeStartY = 0;
        let resizeStartWidth = 0;
        let resizeStartHeight = 0;
        const windowStates = {};

        function openWindow(windowId) {
            const win = document.getElementById(windowId);
            win.classList.add('active');
            focusWindow(win);
        }

        function closeWindow(windowId) {
            document.getElementById(windowId).classList.remove('active');
        }

        function focusWindow(win) {
            document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
            win.classList.add('focused');
            win.style.zIndex = ++zIndexCounter;
        }

        function toggleMaximize(windowId) {
            const win = document.getElementById(windowId);
            
            if (win.classList.contains('maximized')) {
                // Restore to previous size and position
                win.classList.remove('maximized');
                if (windowStates[windowId]) {
                    win.style.width = windowStates[windowId].width;
                    win.style.height = windowStates[windowId].height;
                    win.style.left = windowStates[windowId].left;
                    win.style.top = windowStates[windowId].top;
                }
            } else {
                // Save current state before maximizing
                windowStates[windowId] = {
                    width: win.style.width,
                    height: win.style.height,
                    left: win.style.left,
                    top: win.style.top
                };
                win.classList.add('maximized');
            }
        }

        // Drag and drop for windows
        document.addEventListener('mousedown', (e) => {
            const titleBar = e.target.closest('.window-title-bar');
            if (titleBar && !e.target.classList.contains('window-button')) {
                const windowId = titleBar.dataset.window;
                draggedWindow = document.getElementById(windowId);
                
                // Don't drag if maximized
                if (draggedWindow.classList.contains('maximized')) return;
                
                focusWindow(draggedWindow);
                dragOffsetX = e.clientX - draggedWindow.offsetLeft;
                dragOffsetY = e.clientY - draggedWindow.offsetTop;
                e.preventDefault();
            }

            const resizeHandle = e.target.closest('.window-resize-handle');
            if (resizeHandle) {
                const windowId = resizeHandle.dataset.window;
                resizingWindow = document.getElementById(windowId);
                focusWindow(resizingWindow);
                resizeStartX = e.clientX;
                resizeStartY = e.clientY;
                resizeStartWidth = resizingWindow.offsetWidth;
                resizeStartHeight = resizingWindow.offsetHeight;
                e.preventDefault();
            }

            const win = e.target.closest('.window');
            if (win) focusWindow(win);
        });

        document.addEventListener('mousemove', (e) => {
            if (draggedWindow) {
                draggedWindow.style.left = (e.clientX - dragOffsetX) + 'px';
                draggedWindow.style.top = (e.clientY - dragOffsetY) + 'px';
            }

            if (resizingWindow) {
                const newWidth = resizeStartWidth + (e.clientX - resizeStartX);
                const newHeight = resizeStartHeight + (e.clientY - resizeStartY);
                if (newWidth > 300) resizingWindow.style.width = newWidth + 'px';
                if (newHeight > 200) resizingWindow.style.height = newHeight + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            draggedWindow = null;
            resizingWindow = null;
        });

        // Music Player
        const songs = [
            // Add your songs with album art like this:
            { 
                title: 'Celebration', 
                artist: 'Artist Name', 
                album: 'Album Name', 
                icon: '🎵',
                file: 'music/celebration.mp3',
                cover: null  // Optional: 'music/album-cover.jpg' or 'music/late_registration.png'
            },
            { 
                title: 'Guitare 1', 
                artist: 'Artist Name', 
                album: 'Album Name', 
                icon: '🎸',
                file: 'music/guitare1.mp3',
                cover: null
            },
            { 
                title: 'Thank Oliv', 
                artist: 'Artist Name', 
                album: 'Late Registration', 
                icon: '🎶',
                file: 'music/thankoliv.mp3',
                cover: 'music/late_registration.png'  // Your album cover!
            }
        ];

        let currentTrack = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        const audio = new Audio();
        audio.volume = 1.0;

        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
            }
        });

        audio.addEventListener('timeupdate', () => {
            updateProgress();
        });

        audio.addEventListener('loadedmetadata', () => {
            updateProgress();
        });

        audio.addEventListener('error', (e) => {
            console.error('Audio error:', e);
            alert('Error loading audio file. Check the file path and format.');
        });

        function initMusicPlayer() {
            const playlist = document.getElementById('playlist');
            playlist.innerHTML = songs.map((song, i) => `
                <div class="playlist-item" onclick="playTrack(${i})">
                    <div style="font-weight: bold;">${song.title}</div>
                    <div style="font-size: 10px; color: #606060;">${song.artist} - ${song.album}</div>
                </div>
            `).join('');
            updatePlayerInfo();
        }

        function playTrack(index) {
            currentTrack = index;
            const song = songs[currentTrack];
            
            if (!song.file) {
                alert('No audio file specified for this track. Please update the songs array with your MP3 files.');
                return;
            }
            
            audio.src = song.file;
            audio.load();
            audio.play().then(() => {
                isPlaying = true;
                updatePlayerInfo();
                updatePlayButton();
            }).catch(err => {
                console.error('Playback error:', err);
                alert('Could not play file. Make sure the path is correct and the file format is supported.');
            });
        }

        function togglePlay() {
            if (!songs[currentTrack].file) {
                alert('No audio file specified. Please update the songs array with your MP3 files.');
                return;
            }

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                if (!audio.src) {
                    playTrack(currentTrack);
                    return;
                }
                audio.play();
                isPlaying = true;
            }
            updatePlayButton();
        }

        function stopTrack() {
            audio.pause();
            audio.currentTime = 0;
            isPlaying = false;
            updatePlayButton();
            updateProgress();
        }

        function nextTrack() {
            if (isShuffle) {
                currentTrack = Math.floor(Math.random() * songs.length);
            } else {
                currentTrack = (currentTrack + 1) % songs.length;
            }
            playTrack(currentTrack);
        }

        function previousTrack() {
            currentTrack = (currentTrack - 1 + songs.length) % songs.length;
            playTrack(currentTrack);
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').style.background = isShuffle ? 
                'linear-gradient(180deg, #8080ff 0%, #6060d0 100%)' : 
                'linear-gradient(180deg, #f0f0f0 0%, #c0c0c0 100%)';
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeatBtn').style.background = isRepeat ? 
                'linear-gradient(180deg, #8080ff 0%, #6060d0 100%)' : 
                'linear-gradient(180deg, #f0f0f0 0%, #c0c0c0 100%)';
        }

        function updatePlayerInfo() {
            const song = songs[currentTrack];
            
            // Display album art (image or emoji icon)
            const albumArtEl = document.getElementById('albumArt');
            if (song.cover) {
                albumArtEl.innerHTML = `<img src="${song.cover}" alt="Album Cover">`;
            } else {
                albumArtEl.innerHTML = song.icon;
            }
            
            document.getElementById('playerInfo').innerHTML = `
                <div style="font-weight: bold; margin-bottom: 4px;">${song.title}</div>
                <div style="font-size: 10px; color: #606060;">${song.artist}</div>
                <div style="font-size: 10px; color: #606060;">${song.album}</div>
            `;
            
            document.querySelectorAll('.playlist-item').forEach((item, i) => {
                item.classList.toggle('active', i === currentTrack);
            });
        }

        function updatePlayButton() {
            document.getElementById('playBtn').innerHTML = isPlaying ? '⏸️ Pause' : '▶️ Play';
        }

        function updateProgress() {
            const currentTime = audio.currentTime || 0;
            const duration = audio.duration || 0;
            
            if (duration > 0) {
                const percent = (currentTime / duration) * 100;
                document.getElementById('progressFill').style.width = percent + '%';
            }
            
            document.getElementById('progressTime').textContent = 
                `${formatTime(currentTime)} / ${formatTime(duration)}`;
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        document.getElementById('progressBar').addEventListener('click', (e) => {
            if (!audio.duration) return;
            const bar = e.currentTarget;
            const rect = bar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = audio.duration * percent;
        });

        document.getElementById('volumeSlider').addEventListener('click', (e) => {
            const bar = e.currentTarget;
            const rect = bar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.volume = Math.max(0, Math.min(1, percent));
            document.getElementById('volumeFill').style.width = (percent * 100) + '%';
        });
        
        // Gallery
        const photoImages = [
            // Your photos
            { name: 'DSC00119', file: 'photos/DSC00119.JPG' },
            { name: 'DSC00120', file: 'photos/DSC00120.JPG' },
            { name: 'DSC00121', file: 'photos/DSC00121.JPG' },
            { name: 'DSC00122', file: 'photos/DSC00122.JPG' }
        ];

        const drawingImages = [
            // Your drawings
            { name: 'Boules', file: 'drawings/boules.png' },
            { name: 'Bowbow et Moi', file: 'drawings/bowbow et moi.png' },
            { name: 'Broke', file: 'drawings/broke.png' },
            { name: 'Card', file: 'drawings/card.png' },
            { name: 'Logo', file: 'drawings/logo.png' }
        ];

        let currentFolder = 'photos';
        let currentImageIndex = 0;
        let currentImages = [];

        function switchFolder(folder) {
            currentFolder = folder;
            loadGallery();
        }

        function loadGallery() {
            const images = currentFolder === 'photos' ? photoImages : drawingImages;
            currentImages = images;
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = images.map((img, i) => {
                const thumbContent = img.file ? 
                    `<img src="${img.file}">` : 
                    img.icon;
                
                return `
                    <div class="gallery-item" onclick="openImage(${i})">
                        <div class="gallery-thumbnail">${thumbContent}</div>
                        <div class="gallery-label">${img.name}</div>
                    </div>
                `;
            }).join('');
        }

        function openImage(index) {
            currentImageIndex = index;
            displayImage();
            openWindow('imageWindow');
        }

        function displayImage() {
            const img = currentImages[currentImageIndex];
            document.getElementById('imageTitle').textContent = img.name;
            
            const imageContent = img.file ?
                `<img src="${img.file}" style="max-width: 100%; max-height: 400px; border: 2px solid #808080;">` :
                `<div class="image-display">${img.icon}</div>`;
            
            document.getElementById('imageViewer').innerHTML = `
                ${imageContent}
                <div style="font-weight: bold;">${img.name}</div>
                <div style="font-size: 11px; color: #606060; margin-bottom: 8px;">
                    Image ${currentImageIndex + 1} of ${currentImages.length}
                </div>
                <div class="image-controls">
                    <button class="mac-button" onclick="prevImage()">⬅️ Previous</button>
                    <button class="mac-button" onclick="nextImage()">Next ➡️</button>
                    ${img.file ? '<button class="mac-button" onclick="window.open(currentImages[currentImageIndex].file)">🔍 Full Size</button>' : ''}
                </div>
            `;
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + currentImages.length) % currentImages.length;
            displayImage();
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % currentImages.length;
            displayImage();
        }

        // Videos Application
        const videos = [
            // Add your videos here with this format:
            // { title: 'Video Title', file: 'videos/video.mp4', thumbnail: 'videos/thumb.jpg' }
            { title: 'justice mashup song ', file:'/videos/into you all night.mp4', thumbnail: null },
            { title: 'Example Video 2', file: null, thumbnail: null }
        ];

        let currentVideo = 0;
        const videoPlayer = document.getElementById('videoPlayer');

        function initVideos() {
            const videoList = document.getElementById('videoList');
            videoList.innerHTML = videos.map((video, i) => `
                <div class="video-item" onclick="playVideo(${i})">
                    <div style="font-weight: bold;">${video.title}</div>
                    <div style="font-size: 10px; color: #606060;">${video.file ? 'Ready to play' : 'No file specified'}</div>
                </div>
            `).join('');
        }

        function playVideo(index) {
            currentVideo = index;
            const video = videos[currentVideo];
            
            if (!video.file) {
                alert('No video file specified. Please update the videos array with your video files.');
                return;
            }
            
            videoPlayer.src = video.file;
            videoPlayer.load();
            
            document.querySelectorAll('.video-item').forEach((item, i) => {
                item.classList.toggle('active', i === currentVideo);
            });
        }

        // Notes Application with Dynamic File Loading
        let noteFiles = [];
        let currentNote = 0;

        async function initNotes() {
            try {
                // Try to load notes index file first
                const response = await fetch('notes/index.txt');
                if (response.ok) {
                    const indexText = await response.text();
                    noteFiles = indexText.split('\n').filter(f => f.trim());
                } else {
                    // Fallback to predefined list
                    noteFiles = [
                        'essay-about-noelle.txt',
                        'how-to-add-music.txt',
                        'how-to-add-images.txt',
                        'how-to-add-videos.txt',
                        'setup-guide.txt'
                    ];
                }
                
                loadNotesList();
                if (noteFiles.length > 0) {
                    loadNote(0);
                }
            } catch (error) {
                console.error('Error loading notes:', error);
                showNotesError();
            }
        }

        function loadNotesList() {
            const sidebar = document.getElementById('notesSidebar');
            sidebar.innerHTML = noteFiles.map((file, i) => {
                const name = file.replace('.txt', '').replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                return `
                    <div class="note-item ${i === 0 ? 'active' : ''}" onclick="loadNote(${i})">
                        <div class="note-title">${name}</div>
                    </div>
                `;
            }).join('');
        }

        async function loadNote(index) {
            currentNote = index;
            document.querySelectorAll('.note-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
            
            const content = document.getElementById('notesContent');
            content.textContent = 'Loading...';
            
            try {
                const response = await fetch(`notes/${noteFiles[index]}`);
                if (response.ok) {
                    const text = await response.text();
                    content.textContent = text;
                } else {
                    content.textContent = `Error: Could not load ${noteFiles[index]}\n\nMake sure the file exists in the notes/ folder.`;
                }
            } catch (error) {
                content.textContent = `Error loading note: ${error.message}\n\nCreate a 'notes' folder and add .txt files to use this feature.`;
            }
        }

        function showNotesError() {
            const sidebar = document.getElementById('notesSidebar');
            const content = document.getElementById('notesContent');
            
            sidebar.innerHTML = '<div style="padding: 8px; color: #606060; font-size: 10px;">No notes found</div>';
            content.textContent = `Notes folder not found.

Create a folder called "notes" next to this HTML file and add .txt files.

Optional: Create an index.txt file listing all note files (one per line).

Example structure:
macos9-desktop/
├── index.html
└── notes/
    ├── index.txt
    ├── note1.txt
    └── note2.txt`;
        }

        // Initialize all applications
        initMusicPlayer();
        loadGallery();
        initVideos();
        initNotes();
    </script>
</body>
</html>
